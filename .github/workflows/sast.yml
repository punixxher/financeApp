# Static analysis on every push to master.
#
# Cortex drives several scanners, merges their output into one SARIF document,
# and evaluates a Quality Gate. Findings land in the repository's Security tab.
#
# The gate is reported but does not fail the build yet — see "Enforce the gate"
# at the bottom. This repository already carries findings, and a gate that
# blocks from day one is a gate somebody disables in week two.

name: SAST

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so new advisories against unchanged code still surface.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Code Scanning

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex:
    name: Cortex
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Pinned: a scan that silently changes tool version changes its findings.
      GITLEAKS_VERSION: "8.30.1"
      OSV_VERSION: "2.5.1"
      # "auto" would need Semgrep's metrics enabled; the config names rulesets.
      SEMGREP_SEND_METRICS: "off"
      # This project uses ESLint's flat config (eslint.config.mjs), and Cortex
      # feeds ESLint an eslintrc of its own with the security plugin's rules.
      # Without this, ESLint 8 picks flat mode because the file exists and
      # rejects the flags Cortex passes.
      ESLINT_USE_FLAT_CONFIG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The vulnerability history: what makes a later run say "2 new" instead of
      # listing the same findings forever. Restored from, and saved to, the
      # Actions cache.
      - name: Restore vulnerability history
        uses: actions/cache@v4
        with:
          path: .cortex
          key: cortex-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            cortex-state-${{ github.ref_name }}-
            cortex-state-

      - name: Install Cortex
        # Pinned to a release, not @main: a scanner that changes under you
        # changes its findings without anyone asking for it. v0.2.1 is the first
        # release whose SARIF the Code Scanning API accepts — earlier ones left
        # rules[].shortDescription null and the upload was rejected outright.
        run: go install github.com/vektcore/cortex/cmd/cortex@v0.2.1

      - name: Install the scanners
        run: |
          pip install --quiet semgrep

          npm install -g --no-fund --no-audit \
            eslint@8 eslint-plugin-security @microsoft/eslint-formatter-sarif

          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

          curl -sSL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner

      # ESLint resolves plugins from inside the project it lints, and this one
      # does not depend on the security plugin. Point the resolver at the global
      # install instead of adding a dev dependency to package.json.
      - name: Point ESLint at the global plugins
        run: |
          echo "CORTEX_ESLINT_PLUGINS_DIR=$(npm root -g)" >> "$GITHUB_ENV"
          echo "CORTEX_ESLINT_FORMATTER=$(npm root -g)/@microsoft/eslint-formatter-sarif" >> "$GITHUB_ENV"

      - name: Which scanners apply here
        run: cortex detect .

      - name: Scan
        run: cortex scan . --output results/

      - name: Report
        run: |
          cortex report results/scan.sarif --format markdown >> "$GITHUB_STEP_SUMMARY"

      # Findings show up under Security → Code scanning, annotated on the lines
      # they belong to. Free for public repositories.
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('results/scan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/scan.sarif
          category: cortex

      - name: Keep the SARIF as an artifact
        if: always() && hashFiles('results/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cortex-sarif
          path: results/
          retention-days: 30

      # Reported, not enforced. `cortex verify` exits 1 when the gate fails, and
      # continue-on-error keeps that from failing the build.
      #
      # To start blocking, delete the continue-on-error line. Better still, once
      # a few runs have built up history, gate only on new code:
      #
      #   cortex verify results/scan.sarif --new-only
      #
      # which fails on findings this project has never seen before and ignores
      # the debt already there.
      - name: Quality Gate
        continue-on-error: true
        run: cortex verify results/scan.sarif
